name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tiny-rsi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSLINGSHOT_UI_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Verify on macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure
      - name: Verify macOS display startup handling
        if: runner.os == 'macOS'
        run: |
          set +e
          ./build/games/angry-birds/angry-birds --smoke-test > build/display-smoke.log 2>&1
          result=$?
          set -e
          cat build/display-smoke.log
          if [ "$result" -eq 1 ]; then
            grep -q 'working OpenGL display' build/display-smoke.log
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: scripts/package.sh --skip-ui
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: tiny-rsi-macOS-games
          path: dist/*-macOS.zip
  sanitizers:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTINY_RSI_SANITIZER=${{ matrix.sanitizer }}
      - name: Build runtime checks
        run: cmake --build build --target runtime-tests simulation-tests --parallel 4
      - name: Check memory and undefined behavior
        if: matrix.sanitizer == 'address'
        run: ctest --test-dir build -R 'simulation|runtime' --output-on-failure
      - name: Check concurrent saves for races
        if: matrix.sanitizer == 'thread'
        run: ctest --test-dir build -R runtime --output-on-failure
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build headless environments without graphics dependencies
        run: |
          cmake -S . -B build-headless -DGAMES_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-headless --parallel 4
          ctest --test-dir build-headless --output-on-failure
      - name: Install and check Python research runtime
        run: |
          python -m pip install --no-deps -e research
          tiny-rsi --help
          python -m unittest discover -s research/tests -p '*test*.py'
      - name: Check sandbox launchers
        run: bash -n scripts/*.sh sandbox/scripts/*.sh
