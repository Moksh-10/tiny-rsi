name: Native builds
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxinerama-dev libxcursor-dev xvfb libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test physics and persistence
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render smoke tests (software OpenGL)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1440x900x24" bash tests/render_smoke.sh ./build/the_ascent "$RUNNER_TEMP/ascent-render"
      - name: Upload render captures
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ascent-render-captures
          path: ${{ runner.temp }}/ascent-render/
      - name: Package
        run: cmake --install build --config Release --prefix package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: the-ascent-${{ runner.os }}
          path: package/
