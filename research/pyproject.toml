[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rsi"
version = "0.4.0"
description = "Isolated Ollama game-agent and model-distillation research runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gymnasium = ["gymnasium==1.2.3"]

[project.scripts]
tiny-rsi = "tiny_rsi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
