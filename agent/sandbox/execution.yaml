# Dedicated LIMA_HOME is set by worker.sh; no user-wide default mounts apply.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
cpus: 2
memory: 2GiB
disk: 8GiB
mounts: []
mountType: virtiofs
ssh:
  forwardAgent: false
  forwardX11: false
  loadDotSSHPubKeys: false
containerd:
  system: false
  user: false
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
propagateProxyEnv: false
hostResolver:
  enabled: false
networkOpts:
  hostLoopback: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if test -f /etc/game-research/execution-worker; then exit 0; fi
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y python3 nftables curl ca-certificates libstdc++6
      id researcher >/dev/null 2>&1 || useradd --create-home --shell /bin/bash researcher
      install -d -o researcher -g researcher -m 0700 /var/lib/game-research/results
      install -d -m 0755 /opt/game-research /etc/game-research
      printf 'game-research-lima-v1\n' > /etc/game-research/worker
      printf 'execution-v1\n' > /etc/game-research/execution-worker
      chmod 0444 /etc/game-research/worker /etc/game-research/execution-worker
