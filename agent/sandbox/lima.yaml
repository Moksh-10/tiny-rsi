# Dedicated LIMA_HOME is set by worker.sh; no user-wide default mounts apply.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
cpus: 4
memory: 6GiB
disk: 24GiB
mounts: []
mountType: virtiofs
ssh:
  forwardAgent: false
  forwardX11: false
  loadDotSSHPubKeys: false
containerd:
  system: false
  user: false
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
propagateProxyEnv: false
hostResolver:
  enabled: false
networkOpts:
  hostLoopback: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if test -f /etc/systemd/system/ollama.service && test -x /usr/bin/ollama && id researcher >/dev/null 2>&1; then exit 0; fi
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential cmake git python3 golang-go curl ca-certificates zstd nftables
      id researcher >/dev/null 2>&1 || useradd --create-home --shell /bin/bash researcher
      install -d -o researcher -g researcher -m 0700 /var/lib/game-research/results
      install -d -m 0755 /opt/game-research /etc/game-research
      printf 'game-research-lima-v1\n' > /etc/game-research/worker
      chmod 0444 /etc/game-research/worker
      # Explicit version, downloaded inside the guest. No host Ollama dependency.
      curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-linux-arm64.tar.zst -o /tmp/ollama.tar.zst
      echo "e45b8e6dcb86cb9f3057396351655079c9a4879b4ced2678c9350d375dcbc224  /tmp/ollama.tar.zst" | sha256sum --check -
      tar --zstd -xf /tmp/ollama.tar.zst -C /usr
      rm /tmp/ollama.tar.zst
      id ollama >/dev/null 2>&1 || useradd --system --create-home --home-dir /var/lib/ollama --shell /usr/sbin/nologin ollama
      cat > /etc/systemd/system/ollama.service <<'SERVICE'
      [Unit]
      Description=Guest-local Ollama
      After=network.target
      [Service]
      User=ollama
      Group=ollama
      Environment=OLLAMA_HOST=127.0.0.1:11434
      Environment=OLLAMA_NUM_PARALLEL=1
      Environment=OLLAMA_MAX_LOADED_MODELS=1
      Environment=OLLAMA_KEEP_ALIVE=5m
      ExecStart=/usr/bin/ollama serve
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/ollama
      PrivateTmp=true
      MemoryMax=4G
      [Install]
      WantedBy=multi-user.target
      SERVICE
      systemctl daemon-reload
      systemctl enable --now ollama
